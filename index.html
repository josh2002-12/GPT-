<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>發票小冊</title><style>
*{box-sizing:border-box}body{margin:0;color:#183d38;background:#f4f7f5;font:16px/1.6 "DM Sans",system-ui,sans-serif}header{padding:16px max(5vw,24px);background:white;border-bottom:1px solid #cfdbd6;font-weight:800;font-size:20px}header b{background:#164f46;color:white;padding:4px 9px;border-radius:8px;margin-right:10px}main{max-width:960px;margin:35px auto;padding:0 18px}.hero{background:#154d44;color:white;padding:clamp(24px,5vw,48px);border-radius:22px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:95px;height:135px;right:8%;top:30px;transform:rotate(14deg);background:repeating-linear-gradient(0deg,#e8edc4 0 10px,#8ca990 11px 13px);border:12px solid #e8edc4;box-shadow:10px 10px #32675c;pointer-events:none}h1{margin:0;font-size:clamp(30px,5vw,48px)}p{margin:6px 0 20px}button{background:#174e45;color:white;border:0;padding:12px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.hero button{background:#d7ee9e;color:#193f35;margin:4px}.hero .alt{background:transparent;color:white;border:1px solid #82a297}section{margin:18px 0;background:white;padding:24px;border-radius:16px;border:1px solid #dce4df}h2{margin:0 0 14px;font-size:21px}video{width:100%;max-height:350px;background:#182c29}#msg{color:#355c50;margin:12px 4px}#msg:empty{display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row button{background:#eaf1ed;color:#245448}small{color:#567067}label{display:block}input{display:block;width:100%;padding:10px;font:inherit;border:1px solid #adbbb4;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.record{padding:13px 0;border-top:1px solid #dce4df}.empty{padding:22px 0;color:#546d65}button:disabled{opacity:.5}@media(max-width:640px){.hero:after{width:38px;height:52px;right:18px;top:20px;border-width:5px}.grid{grid-template-columns:1fr}.hero p{max-width:240px}}
</style><header><b>▤</b>發票小冊</header><main><div class="hero"><h1>掃描發票</h1><p>將鏡頭對準電子發票左側的 QR Code。</p><button id="scan">開啟相機</button><button class="alt" id="upload">選擇照片</button><input hidden style="display:none" type="file" accept="image/*" id="file"></div><div id="msg" role="status"></div><section id="camera" hidden><video muted playsinline autoplay></video><button id="stop">關閉相機</button></section><section id="review" hidden><h2>核對發票</h2><form><div class="grid"></div><button>確認儲存</button> <button type="button" id="cancel">取消</button></form></section><section><div class="row"><h2>發票紀錄</h2><button id="download">匯出 Excel</button></div><small>紀錄儲存在這台裝置的瀏覽器</small><div id="list"></div></section></main><script src="qr.js"></script><script src="excel.js"></script><script src="app.js"></script></html>
